version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    labels:
      - area:build
    groups:
      # Spring Boot parent and everything it manages move together
      spring-boot:
        patterns:
          - org.springframework.boot:*
      build-plugins:
        patterns:
          - com.diffplug.spotless:*
          - com.palantir.javaformat:*
          - com.github.spotbugs:*
          - org.jacoco:*

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    labels:
      - area:ci
    groups:
      github-actions:
        patterns:
          - '*'
