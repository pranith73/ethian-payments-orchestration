name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'   # weekly, Monday 04:17 UTC

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (java)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      # Compile only; tests and quality gates run in ci.yml
      - name: Build
        run: ./mvnw -B -DskipTests -Dspotless.check.skip=true -Dspotbugs.skip=true -Djacoco.skip=true package

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin
